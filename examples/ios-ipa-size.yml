name: IPA size

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ipa-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: macos-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build base and head IPAs
        run: |
          for variant in base head; do
            (
              cd "$variant"
              xcodebuild archive \
                -scheme App \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath "$RUNNER_TEMP/$variant/App.xcarchive"
              xcodebuild -exportArchive \
                -archivePath "$RUNNER_TEMP/$variant/App.xcarchive" \
                -exportOptionsPlist ExportOptions.plist \
                -exportPath "$RUNNER_TEMP/$variant/export"
            )
          done

      - name: Report IPA size
        uses: appshipkit/app-size-report@v1
        with:
          head-path: ${{ runner.temp }}/head/export/App.ipa
          base-path: ${{ runner.temp }}/base/export/App.ipa
          name: iOS release IPA
          max-increase-bytes: 2097152

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
