name: APK size

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: apk-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build base APK
        continue-on-error: true
        working-directory: base
        run: ./gradlew assembleRelease

      - name: Build head APK
        working-directory: head
        run: ./gradlew assembleRelease

      - name: Report APK size
        id: size
        uses: appshipkit/app-size-report@v1
        with:
          head-path: head/app/build/outputs/apk/release/app-release-unsigned.apk
          base-path: base/app/build/outputs/apk/release/app-release-unsigned.apk
          name: Android release APK
          max-increase-percent: 5
          top-files: 15

      - name: Print change
        env:
          DIFF_BYTES: ${{ steps.size.outputs.diff-bytes }}
          DIFF_PERCENT: ${{ steps.size.outputs.diff-percent }}
        run: echo "APK changed by $DIFF_BYTES bytes ($DIFF_PERCENT%)"
